services:
  twin_engine:
    build:
      context: .
      dockerfile: services/twin_engine/Dockerfile
    container_name: twin_engine_service
    ports:
      - "8000:8000"
    environment:
      - INFLUXDB_URL=http://influxdb_service:8086
      - INFLUXDB_TOKEN=my-super-secret-auth-token
      - INFLUXDB_ORG=opto-twin
      - INFLUXDB_BUCKET=photodetector_telemetry
      - ZMQ_INGESTION_HOST=ingestion
      - ZMQ_INGESTION_PORT=5555
      - MQTT_BROKER_HOST=mqtt_broker
      - MQTT_BROKER_PORT=1883
    depends_on:
      - ingestion
      - mqtt_broker
    networks:
      - opto-network

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    
    ports:
      - "5555:5555"
    environment:
      - ZMQ_PUB_PORT=5555
    networks:
      - opto-network

  mqtt_broker:
    image: eclipse-mosquitto:2.0
    container_name: mqtt_broker_service
    ports:
      - "1883:1883"
    volumes:
      - ./services/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - opto-network

  influxdb:
    image: influxdb:2.7
    container_name: influxdb_service
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=opto-twin
      - DOCKER_INFLUXDB_INIT_BUCKET=photodetector_telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - opto-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_service
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - opto-network

networks:
  opto-network:
    driver: bridge

volumes:
  influxdb-data:
  grafana-data: