version: '3.8'

services:
  twin_engine:
    build:
      context: .
      dockerfile: services/twin_engine/Dockerfile
    container_name: twin_engine_service
    ports:
      - "8000:8000"
    networks:
      - opto-network

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: ingestion_service
    depends_on:
      - twin_engine
    networks:
      - opto-network

  influxdb:
    image: influxdb:2.7
    container_name: influxdb_service
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=opto-twin
      - DOCKER_INFLUXDB_INIT_BUCKET=photodetector_telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - opto-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_service
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - opto-network

networks:
  opto-network:
    driver: bridge

volumes:
  influxdb-data:
  grafana-data: